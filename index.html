<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pong — jeu web</title>
<style>
  :root {
    --bg: #0b0e14;
    --fg: #e6edf3;
    --dim: #7d8590;
    --line: #1f2733;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 12px; padding: 12px;
  }
  canvas {
    background: #05070c;
    border-radius: 12px;
    box-shadow: 0 0 0 1px var(--line), 0 18px 50px rgba(0, 0, 0, .6);
    max-width: 100%; max-height: 76vh;
    touch-action: none;
  }
  .bar {
    display: flex; gap: 6px 16px; flex-wrap: wrap; justify-content: center;
    font-size: 12px; color: var(--dim);
  }
  kbd {
    background: #161b22; border: 1px solid #30363d; border-radius: 5px;
    padding: 1px 6px; color: #c9d1d9; font-size: 11px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="500" aria-label="Terrain de Pong"></canvas>
  <div class="bar">
    <span><kbd>W</kbd><kbd>S</kbd> joueur 1</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> joueur 2</span>
    <span><kbd>2</kbd> mode 1/2 joueurs</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>M</kbd> son</span>
    <span><kbd>R</kbd> réinitialiser</span>
    <span><kbd>Espace</kbd> servir / rejouer</span>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- constantes
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const PADDLE_W = 12;
  const PADDLE_H = 92;
  const MARGIN = 26;
  const BALL_R = 9;
  const BALL_SPEED_START = 340;   // px/s
  const BALL_SPEED_MAX = 780;
  const SPEED_UP = 1.045;         // accélération à chaque renvoi de raquette
  const PADDLE_SPEED = 620;       // px/s (joueur)
  const AI_SPEED = 330;           // px/s (adversaire, volontairement battable)
  const AI_DEADZONE = 10;
  const MAX_SCORE = 7;
  const SERVE_DELAY = 0.85;       // s de pause entre deux points

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // ------------------------------------------------------------------- état
  const state = {
    running: false,      // échange en cours (balle en mouvement)
    paused: false,
    over: false,
    twoPlayers: false,
    muted: false,
    manual: false,       // true = plus de physique auto (utilisé par les tests)
    score: [0, 0],
    serveTimer: 0,
    serveDir: 1,         // 1 = la balle part vers la droite
    hue: 200,            // teinte courante de la balle
    p1: { x: MARGIN, y: (H - PADDLE_H) / 2, h: PADDLE_H },
    p2: { x: W - MARGIN - PADDLE_W, y: (H - PADDLE_H) / 2, h: PADDLE_H },
    ball: { x: W / 2, y: H / 2, vx: 0, vy: 0, r: BALL_R, speed: BALL_SPEED_START },
    trail: [],
  };

  const keys = Object.create(null);
  let dragging = false;

  // -------------------------------------------------------------- utilitaires
  /** Teinte suivante : pas d'or ~137,5° -> jamais deux couleurs identiques d'affilée. */
  function nextHue() {
    state.hue = (state.hue + 137.508) % 360;
    return state.hue;
  }

  function ballColor(alpha = 1) {
    return `hsla(${state.hue}, 95%, 62%, ${alpha})`;
  }

  let actx = null;
  function blip(freq, dur = 0.055) {
    if (state.muted) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = actx || new AC();
      const t = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(actx.destination);
      osc.start(t);
      osc.stop(t + dur);
    } catch (_) { /* audio indisponible : on joue en silence */ }
  }

  // ------------------------------------------------------------------- partie
  function serve(dir = state.serveDir) {
    const b = state.ball;
    state.serveDir = dir;
    b.x = W / 2;
    b.y = H / 2;
    b.speed = BALL_SPEED_START;
    const angle = (Math.random() * 0.5 - 0.25); // léger angle de départ
    b.vx = Math.cos(angle) * b.speed * dir;
    b.vy = Math.sin(angle) * b.speed;
    state.trail.length = 0;
    state.hue = nextHue();   // nouvelle couleur à chaque service
    state.running = true;
    state.serveTimer = 0;
    blip(520);
  }

  function resetMatch(autoStart = false) {
    state.score = [0, 0];
    state.over = false;
    state.paused = false;
    state.p1.y = (H - PADDLE_H) / 2;
    state.p2.y = (H - PADDLE_H) / 2;
    state.ball.x = W / 2;
    state.ball.y = H / 2;
    state.ball.vx = 0;
    state.ball.vy = 0;
    state.ball.speed = BALL_SPEED_START;
    state.running = false;
    state.trail.length = 0;
    state.serveTimer = autoStart ? 0.4 : 0;
  }

  function point(scorer) {
    state.score[scorer]++;
    state.running = false;
    state.ball.x = W / 2;
    state.ball.y = H / 2;
    state.ball.vx = 0;
    state.ball.vy = 0;
    state.trail.length = 0;
    blip(scorer === 0 ? 300 : 220, 0.12);
    if (state.score[scorer] >= MAX_SCORE) {
      state.over = true;
      blip(760, 0.2);
      return;
    }
    // la balle repart vers celui qui vient d'encaisser
    state.serveDir = scorer === 0 ? 1 : -1;
    state.serveTimer = SERVE_DELAY;
  }

  function bounceOffPaddle(paddle, dir) {
    const b = state.ball;
    const rel = clamp((b.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2), -1, 1);
    const angle = rel * (Math.PI / 3.2);          // jusqu'à ~56°
    b.speed = Math.min(b.speed * SPEED_UP, BALL_SPEED_MAX);
    b.vx = Math.cos(angle) * b.speed * dir;
    b.vy = Math.sin(angle) * b.speed;
    b.hue = nextHue();                             // <<< la balle change de couleur
  }

  function movePlayers(dt) {
    const dir1 = (keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0);
    state.p1.y = clamp(state.p1.y + dir1 * PADDLE_SPEED * dt, 0, H - state.p1.h);
    if (state.twoPlayers) {
      const dir2 = (keys['arrowdown'] ? 1 : 0) - (keys['arrowup'] ? 1 : 0);
      state.p2.y = clamp(state.p2.y + dir2 * PADDLE_SPEED * dt, 0, H - state.p2.h);
    } else {
      updateAI(dt);
    }
  }

  function updateAI(dt) {
    const p2 = state.p2;
    const center = p2.y + p2.h / 2;
    // l'IA ne suit la balle que lorsqu'elle vient vers elle, sinon elle recentre
    const target = state.ball.vx > 0 ? state.ball.y : H / 2;
    const diff = target - center;
    if (Math.abs(diff) > AI_DEADZONE) {
      const step = Math.min(AI_SPEED * dt, Math.abs(diff) - AI_DEADZONE);
      p2.y = clamp(p2.y + Math.sign(diff) * step, 0, H - p2.h);
    }
  }

  /** Avance la simulation de dt secondes. */
  function update(dt) {
    if (state.paused || state.over) return;

    movePlayers(dt);

    if (!state.running) {
      if (state.serveTimer > 0) {
        state.serveTimer -= dt;
        if (state.serveTimer <= 0) serve();
      }
      return;
    }

    const b = state.ball;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // murs haut / bas
    if (b.y - b.r < 0 && b.vy < 0) {
      b.y = b.r;
      b.vy = -b.vy;
      b.hue = nextHue();                           // <<< couleur à chaque touche
    } else if (b.y + b.r > H && b.vy > 0) {
      b.y = H - b.r;
      b.vy = -b.vy;
      b.hue = nextHue();
    }

    const p1 = state.p1;
    const p2 = state.p2;

    // raquette gauche
    if (b.vx < 0 &&
        b.x - b.r <= p1.x + PADDLE_W && b.x + b.r >= p1.x &&
        b.y + b.r >= p1.y && b.y - b.r <= p1.y + p1.h) {
      b.x = p1.x + PADDLE_W + b.r;
      bounceOffPaddle(p1, 1);
    }

    // raquette droite
    if (b.vx > 0 &&
        b.x + b.r >= p2.x && b.x - b.r <= p2.x + PADDLE_W &&
        b.y + b.r >= p2.y && b.y - b.r <= p2.y + p2.h) {
      b.x = p2.x - b.r;
      bounceOffPaddle(p2, -1);
    }

    // trace
    state.trail.push({ x: b.x, y: b.y });
    if (state.trail.length > 14) state.trail.shift();

    // buts
    if (b.x + b.r < 0) point(1);
    else if (b.x - b.r > W) point(0);
  }

  // ---------------------------------------------------------------- rendu
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // filet central
    ctx.save();
    ctx.setLineDash([9, 13]);
    ctx.strokeStyle = '#1f2733';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W / 2, 8);
    ctx.lineTo(W / 2, H - 8);
    ctx.stroke();
    ctx.restore();

    // tableau des scores
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = '700 54px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#2b3442';
    ctx.fillText(String(state.score[0]), W / 2 - 90, 22);
    ctx.fillText(String(state.score[1]), W / 2 + 90, 22);
    ctx.font = '600 11px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#4d5866';
    ctx.fillText(state.twoPlayers ? 'JOUEUR 2' : 'IA', W / 2 + 90, 84);
    ctx.fillText('JOUEUR 1', W / 2 - 90, 84);
    ctx.restore();

    // raquettes
    ctx.save();
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#58a6ff';
    ctx.fillStyle = '#8bc4ff';
    ctx.fillRect(state.p1.x, state.p1.y, PADDLE_W, state.p1.h);
    ctx.shadowColor = state.twoPlayers ? '#f778ba' : '#f0883e';
    ctx.fillStyle = state.twoPlayers ? '#ff9ed2' : '#ffb86b';
    ctx.fillRect(state.p2.x, state.p2.y, PADDLE_W, state.p2.h);
    ctx.restore();

    // trace de la balle
    for (let i = 0; i < state.trail.length; i++) {
      const t = state.trail[i];
      const a = (i / state.trail.length) * 0.32;
      ctx.beginPath();
      ctx.fillStyle = ballColor(a);
      ctx.arc(t.x, t.y, state.ball.r * (0.35 + 0.5 * (i / state.trail.length)), 0, Math.PI * 2);
      ctx.fill();
    }

    // balle
    ctx.save();
    ctx.shadowBlur = 22;
    ctx.shadowColor = ballColor(0.95);
    ctx.fillStyle = ballColor(1);
    ctx.beginPath();
    ctx.arc(state.ball.x, state.ball.y, state.ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // messages
    if (state.over) {
      banner(`PARTIE TERMINÉE — ${winnerLabel()} gagne ${state.score[0]} : ${state.score[1]}`,
             "Espace ou toucher l'écran pour rejouer");
    } else if (state.paused) {
      banner('PAUSE', 'P pour reprendre');
    } else if (!state.running && state.serveTimer <= 0) {
      banner('PONG', "Espace ou toucher l'écran pour servir");
    }
  }

  function winnerLabel() {
    const w = state.score[0] > state.score[1] ? 0 : 1;
    if (w === 0) return 'le joueur 1';
    return state.twoPlayers ? 'le joueur 2' : "l'IA";
  }

  function banner(title, sub) {
    ctx.save();
    ctx.fillStyle = 'rgba(5, 7, 12, .6)';
    ctx.fillRect(0, H / 2 - 66, W, 132);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e6edf3';
    ctx.font = '700 26px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText(title, W / 2, H / 2 - 12);
    ctx.fillStyle = '#7d8590';
    ctx.font = '400 14px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText(sub, W / 2, H / 2 + 22);
    ctx.restore();
  }

  // ------------------------------------------------------------- boucle
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (!state.manual) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------- clavier
  const BLOCKED = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'spacebar'];

  function primaryAction() {
    if (state.over) { resetMatch(true); return; }
    if (!state.running && state.serveTimer <= 0) { serve(); return; }
    state.paused = !state.paused;
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (BLOCKED.includes(k)) e.preventDefault();
    if (e.repeat) { keys[k] = true; return; }
    keys[k] = true;

    if (k === ' ' || k === 'spacebar' || k === 'enter') primaryAction();
    else if (k === 'p') { if (state.running) state.paused = !state.paused; }
    else if (k === 'm') state.muted = !state.muted;
    else if (k === 'r') resetMatch(false);
    else if (k === '2') { state.twoPlayers = !state.twoPlayers; resetMatch(false); }
  });

  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // --------------------------------------------------------------- tactile
  function pointerToCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return {
      y: (e.clientY - r.top) / r.height * H,
      x: (e.clientX - r.left) / r.width * W,
    };
  }

  function pointerDrag(e) {
    const { x, y } = pointerToCanvas(e);
    const which = state.twoPlayers ? (x < W / 2 ? state.p1 : state.p2) : state.p1;
    which.y = clamp(y - which.h / 2, 0, H - which.h);
  }

  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    if (!state.running) primaryAction();
    else pointerDrag(e);
  });
  canvas.addEventListener('pointermove', (e) => { if (dragging) pointerDrag(e); });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });

  // -------------------------------------------------------------- démarrage
  state.hue = nextHue();
  requestAnimationFrame(frame);

  // Point d'entrée pour les tests automatisés (inspection / pas-à-pas).
  window.__pong = {
    state, serve, resetMatch, update, point, ballColor, W, H,
  };
})();
</script>
</body>
</html>
